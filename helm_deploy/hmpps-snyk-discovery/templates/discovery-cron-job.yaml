                capabilities:
                  drop:
                  - ALL
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
      {{- include "snykScanCronJob.envs" .Values | nindent 14 }}
          restartPolicy: Never
{{- end }}
