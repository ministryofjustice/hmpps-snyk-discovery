  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0 # Do not retry
      ttlSecondsAfterFinished: 345600
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            fsGroup: 2000
          initContainers:
            - name: docker-config-init
              image: alpine:3.20
              command:
                - /bin/sh
                - -ec
                - |
                  cp /docker-config-secret/config.json /docker-config/config.json
                  chown 2000:2000 /docker-config
                  chown 2000:2000 /docker-config/config.json
                  chmod 700 /docker-config
                  chmod 600 /docker-config/config.json
              securityContext:
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: docker-config-secret
                  mountPath: /docker-config-secret
                  readOnly: true
                - name: docker-config
                  mountPath: /docker-config
          containers:
            - name: hmpps-snyk-discovery
              image: "{{ .Values.image.repository }}:{{ .Values.version }}"
              command: ["uv", "run", "python", "-u", "/app/snyk_discovery.py", "-i"]
              resources:
                {{- toYaml .Values.snykScanCronJob.resources | nindent 16 }}
              securityContext:
                capabilities:
                  drop:
                  - ALL
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: docker-config
                  mountPath: /home/appuser/.docker
                  readOnly: true
      {{- include "snykScanCronJob.envs" .Values | nindent 14 }}
          volumes:
            - name: docker-config
              emptyDir: {}
            - name: docker-config-secret
              secret:
                secretName: ghcr-pull-secret
                items:
                  - key: {{ trimSuffix "?" $ghcrSecretKey }}
                    path: config.json
          restartPolicy: Never
{{- end }}
