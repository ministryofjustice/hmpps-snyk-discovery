{{- if .Values.snykScanCronJob.enabled -}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hmpps-snyk-discovery-full
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.snykScanCronJob.full_scan_schedule }}"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0 # Do not retry
      ttlSecondsAfterFinished: 345600
      template:
        spec:
          containers:
            - name: hmpps-snyk-discovery
              image: "{{ .Values.image.repository }}:{{ .Values.version }}"
              command: ["uv", "run", "python", "-u", "/app/snyk_discovery.py", "-f"]
              resources:
                {{- toYaml .Values.snykScanCronJob.resources | nindent 16 }}
              securityContext:
                capabilities:
                  drop:
                  - ALL
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
      {{- include "snykScanCronJob.envs" .Values | nindent 14 }}
          restartPolicy: Never

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hmpps-snyk-discovery-incremental
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.snykScanCronJob.incremental_scan_schedule }}"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0 # Do not retry
      ttlSecondsAfterFinished: 345600
      template:
        spec:
          containers:
            - name: hmpps-snyk-discovery
              image: "{{ .Values.image.repository }}:{{ .Values.version }}"
              command: ["uv", "run", "python", "-u", "/app/snyk_discovery.py", "-i"]
              resources:
                {{- toYaml .Values.snykScanCronJob.resources | nindent 16 }}
              securityContext:
                capabilities:
                  drop:
                  - ALL
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
      {{- include "snykScanCronJob.envs" .Values | nindent 14 }}
          restartPolicy: Never
{{- end }}
