---
# Per environment values which override defaults in hmpps-snyk-discovery/values.yaml

generic-prometheus-alerts:
  alertSeverity: hmpps-sre-alerts-prod

snykScanCronJob:
  enabled: false
  full_scan_schedule: "00 21 * * 1-5"
  incremental_scan_schedule: "30 7-17/2 * * 1-5"
  env:
    LOG_LEVEL: info
