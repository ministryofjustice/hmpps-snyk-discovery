---
# Per environment values which override defaults in hmpps-snyk-discovery/values.yaml

generic-prometheus-alerts:
  alertSeverity: hmpps-sre-alerts-nonprod

snykScanCronJob:
  enabled: true
  full_scan_schedule: "30 4 * * 1-5"
  incremental_scan_schedule: "00 9 * * 1-5"
  env:
    LOG_LEVEL: info
  namespace_secrets:
    hmpps-envoy-https-proxy-env:
      HTTP_PROXY: "HTTP_PROXY"
      HTTPS_PROXY: "HTTPS_PROXY"
      NO_PROXY: "NO_PROXY"
      http_proxy: "HTTP_PROXY"
      https_proxy: "HTTPS_PROXY"
      no_proxy: "NO_PROXY"
